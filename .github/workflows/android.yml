name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # Lets anyone with access rebuild from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Publishing the APK as a release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The fixed signing key: without it every build would get a new random key, Android would
      # refuse to update over the installed app, and reinstalling would wipe people's shows.
      - name: Add the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/podouvir-release.keystore
            echo "Signing key added"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set: builds use a throwaway key and no release is published."
          fi

      - name: Module structure rules tests
        run: ./gradlew -p build-logic :rules:test

      # Every Gradle invocation also checks the module structure (podparar.module-rules).
      - name: Unit tests
        run: ./gradlew :core:model:test testDebugUnitTest

      # Room writes the database schema while compiling; it must be committed (CLAUDE.md, "Data").
      # On a mismatch the generated files are printed so they can be copied into the repo.
      - name: Room schemas are committed
        # Also after failed tests: a new schema version's migration test fails until its schema is committed.
        if: always()
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "::error::core/database/schemas differs from what Room generated; commit the files below."
            git status --porcelain core/database/schemas
            find core/database/schemas -name '*.json' -exec sh -c 'echo "=== $1"; cat "$1"; echo "=== end"' _ {} \;
            exit 1
          fi

      # Pictures of the screens that the UI tests draw (Roborazzi), for checking the layout.
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          find . -path '*/build/outputs/roborazzi/*.png' -exec cp {} screenshots/ \;
          ls screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: podparar-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # One release per build, tagged v0.<build>, so update apps such as Obtainium see a new
      # version each time. GitHub's fixed link always serves the newest one:
      # https://github.com/<owner>/<repo>/releases/latest/download/PodOuvir.apk
      - name: Publish a release
        if: github.event_name == 'push' && (github.ref_name == 'claude/dazzling-gates-kqo3gf' || github.ref_name == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f app/podouvir-release.keystore ]; then
            echo "::error::Not publishing: the SIGNING_KEYSTORE_BASE64 secret is missing, so this APK couldn't update an installed copy."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk PodOuvir.apk
          # PodParar.apk is kept so builds before the rename still find updates.
          cp app/build/outputs/apk/release/app-release.apk PodParar.apk
          assets="PodOuvir.apk PodParar.apk"
          if ls screenshots/*.png >/dev/null 2>&1; then
            (cd screenshots && zip -q ../screenshots.zip *.png)
            assets="$assets screenshots.zip"
          fi
          gh release create "v0.${GITHUB_RUN_NUMBER}" $assets \
            --target "$GITHUB_SHA" \
            --title "PodOuvir 0.${GITHUB_RUN_NUMBER}" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Install PodOuvir.apk on Android; it updates over any earlier PodOuvir or PodParar build." \
            --latest
          # Keep the three newest releases.
          gh release list --limit 100 --json tagName --jq '.[3:][].tagName' | xargs -r -n1 gh release delete --cleanup-tag --yes
