name: Android build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # Lets anyone with access rebuild from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Publishing the APK as a release.
      contents: write
    env:
      # Secrets can't be read in a step's `if`, so whether Google Play upload is set up is exposed here.
      PLAY_CONFIGURED: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The fixed signing key: without it every build would get a new random key, Android would
      # refuse to update over the installed app, and reinstalling would wipe people's shows.
      - name: Add the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/podouvir-release.keystore
            echo "Signing key added"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set: builds use a throwaway key and no release is published."
          fi

      - name: Module structure rules tests
        run: ./gradlew -p build-logic :rules:test

      # Every Gradle invocation also checks the module structure (podparar.module-rules).
      # testDebugUnitTest runs in every module that has it: all the libraries and features. :app
      # has flavors, so its tasks are testGithubDebugUnitTest and testPlayDebugUnitTest (it has no tests).
      - name: Unit tests
        run: ./gradlew :core:model:test testDebugUnitTest

      # Room writes the database schema while compiling; it must be committed (CLAUDE.md, "Data").
      # On a mismatch the generated files are printed so they can be copied into the repo.
      - name: Room schemas are committed
        # Also after failed tests: a new schema version's migration test fails until its schema is committed.
        if: always()
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "::error::core/database/schemas differs from what Room generated; commit the files below."
            git status --porcelain core/database/schemas
            find core/database/schemas -name '*.json' -exec sh -c 'echo "=== $1"; cat "$1"; echo "=== end"' _ {} \;
            exit 1
          fi

      # Pictures of the screens that the UI tests draw (Roborazzi), for checking the layout.
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          find . -path '*/build/outputs/roborazzi/*.png' -exec cp {} screenshots/ \;
          ls screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      # Two distributions (CLAUDE.md/README): the github APKs, with the self-updater, and the
      # play bundle for Google Play, without it.
      - name: Build APKs and the Play bundle
        run: ./gradlew assembleGithubDebug assembleGithubRelease bundlePlayRelease

      - uses: actions/upload-artifact@v4
        with:
          name: podparar-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk

      # Only a bundle signed with the real key is worth keeping: Play rejects any other upload key.
      - name: Check the Play bundle is signed
        id: play_bundle
        run: |
          if [ -f app/podouvir-release.keystore ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not uploading the Play bundle: the SIGNING_KEYSTORE_BASE64 secret is missing, so it isn't signed with the upload key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.play_bundle.outputs.signed == 'true'
        with:
          name: escutae-play-aab
          path: app/build/outputs/bundle/playRelease/*.aab

      # One release per build, tagged v0.<build>, so update apps such as Obtainium see a new
      # version each time. GitHub's fixed link always serves the newest one:
      # https://github.com/<owner>/<repo>/releases/latest/download/Escutae.apk
      - name: Publish a release
        if: github.event_name == 'push' && (github.ref_name == 'claude/dazzling-gates-kqo3gf' || github.ref_name == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f app/podouvir-release.keystore ]; then
            echo "::error::Not publishing: the SIGNING_KEYSTORE_BASE64 secret is missing, so this APK couldn't update an installed copy."
            exit 1
          fi
          cp app/build/outputs/apk/github/release/app-github-release.apk Escutae.apk
          # PodOuvir.apk is kept so builds from before this rename still find updates.
          cp app/build/outputs/apk/github/release/app-github-release.apk PodOuvir.apk
          assets="Escutae.apk PodOuvir.apk"
          if ls screenshots/*.png >/dev/null 2>&1; then
            (cd screenshots && zip -q ../screenshots.zip *.png)
            assets="$assets screenshots.zip"
          fi
          gh release create "v0.${GITHUB_RUN_NUMBER}" $assets \
            --target "$GITHUB_SHA" \
            --title "Escutaê 0.${GITHUB_RUN_NUMBER}" \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7}. Install Escutae.apk on Android; it updates over any earlier Escutaê or PodOuvir build." \
            --latest
          # Keep the three newest releases.
          gh release list --limit 100 --json tagName --jq '.[3:][].tagName' | xargs -r -n1 gh release delete --cleanup-tag --yes

      # The Play bundle goes to the internal testing track, once a service account is set up
      # (PLAY_SERVICE_ACCOUNT_JSON, see README). Google requires the very first bundle of a new app
      # to be uploaded by hand in the Play Console; after that, CI uploads every build.
      - name: Upload to Google Play (internal testing)
        if: env.PLAY_CONFIGURED == 'true' && github.event_name == 'push' && (github.ref_name == 'claude/dazzling-gates-kqo3gf' || github.ref_name == 'main')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.punyplatypus.escutae
          releaseFiles: app/build/outputs/bundle/playRelease/*.aab
          track: internal
          status: completed
